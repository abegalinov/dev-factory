version: 1

runtime:
  # Keep true until discovery and recovery are proven against the real repository.
  observe_only: true
  # Concurrency 1: at most one Claude run per poll.
  max_agent_runs_per_poll: 1
  # Ephemeral state only: worktrees, locks, logs. Relative to the factory home.
  runtime_root: .runtime
  log_level: INFO
  # Agent and verification runs wait for the next poll while the host lacks headroom.
  # MemAvailable already counts reclaimable page cache; swap is the safety net beyond it.
  min_available_memory_mb: 500
  max_load_per_cpu: 1.5

github:
  cli: gh
  timeout_seconds: 60
  # Retries apply to reads only; mutations are never blindly repeated.
  max_retries: 3

claude:
  # Executable inside the agent image (or on the host with allow_unisolated).
  cli: claude
  timeout_seconds: 1800
  # A full-stack implementation needs well over 100 turns (40 ran out on the first real
  # feature); max_budget_usd is the cost guard.
  max_turns: 150
  max_budget_usd: 5
  model: null
  # Agents run in each project's agent.image container. Running on the host instead is
  # refused in mutation mode unless this is true. Keep false.
  allow_unisolated: false
  # The only variables forwarded into agent containers, by name (values never in argv).
  # Create a long-lived token with `claude setup-token`; provide it via the service env.
  env_passthrough: [ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN]
  # Values for env_passthrough (mode 600). The process environment takes precedence.
  env_file: ~/.config/dev-factory/agent.env

# Limits for every container (agents and verification), sized for a small shared host
# (2 vCPU / 1.8 GB). Each container also runs with no capabilities, no-new-privileges, a
# read-only root, swap disabled, OOM priority (killed before anything else), and only the
# task directory plus a disposable on-disk HOME mounted.
docker:
  cli: docker
  # Agents need egress to the Anthropic API and package registries.
  network: bridge
  # Enough for Claude Code (~300-400 MB) plus light commands. Full test suites run in CI.
  memory: 768m
  cpus: "1"
  # Production containers use the default weight 1024; factory work yields under contention.
  cpu_shares: 256
  pids_limit: 512
  tmp_size: 128m
  # All factory containers share this slice's caps (install deploy/systemd/dev-factory.slice).
  cgroup_parent: dev-factory.slice

# Human approval of spec merge, code merge, and deployment is not configurable.
policy:
  max_spec_attempts: 2
  max_implementation_attempts: 3
  # Automated reviews per spec or code PR before its first human review (projects with
  # agent.review: true). Its blocking findings go back to the agent once.
  max_review_rounds: 1
  # Triage rounds before the spec (projects with agent.triage: true).
  max_triage_rounds: 3
  checks_timeout_minutes: 60
