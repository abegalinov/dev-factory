[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-factory"
version = "0.1.0"
description = "Portable GitHub-native feature delivery orchestrator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1"]

[project.scripts]
dev-factory = "dev_factory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit selection so ruff upgrades do not silently change CI.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "TRY"]
ignore = ["TRY003"]  # contextual messages in raise sites are clearer than per-error classes
